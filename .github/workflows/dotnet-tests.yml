name: dotnet-tests

on:
  push:
    branches:
      - main
      - chore/architecture-gate-preparation
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EducationPlatform.sln

      - name: Test
        run: dotnet test EducationPlatform.sln --no-restore
